name: Tests

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    services:
      artemis:
        image: apache/activemq-artemis:latest-alpine@sha256:1bce124d2324faeb1253e2db4bb68d64decf46412ecfd8d9ef46c08b1b4af5b4
        env:
          ANONYMOUS_LOGIN: "true"
        ports:
          - 1883:1883
        options: >-
          --security-opt no-new-privileges:true

      mosquitto:
        image: eclipse-mosquitto:2@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797  # 2.1.2-alpine
        ports:
          - 1884:1883
        options: >-
          --security-opt no-new-privileges:true

      hivemq:
        image: hivemq/hivemq-ce@sha256:7ae39e84654a41ced6e946dd84f131d508bc2b862ec96265b7f23d241db214da  # latest
        ports:
          - 1886:1883
        options: >-
          --security-opt no-new-privileges:true

      nanomq:
        image: emqx/nanomq:0.25.5@sha256:a03605fe4061452609e0cd89e4ac0c382dc5bb338319e712bb25b6d21a72ba0a
        ports:
          - 1887:1883
        options: >-
          --security-opt no-new-privileges:true

      emqx:
        image: emqx/emqx@sha256:0ba29902a8e552f7152754860b4b61b49a7e16fa376035bcf10021e944b2c0a0  # 6.2.2
        ports:
          - 1888:1883
        options: >-
          --security-opt no-new-privileges:true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Copy mosquitto config
        env:
          MOSQUITTO_ID: ${{ job.services.mosquitto.id }}
        run: |
          echo "Mosquitto container: $MOSQUITTO_ID"
          docker cp docker/mosquitto.conf "$MOSQUITTO_ID:/mosquitto/config/mosquitto.conf"
          docker cp docker/mosquitto.acl "$MOSQUITTO_ID:/mosquitto/config/mosquitto.acl"
          docker exec "$MOSQUITTO_ID" chmod 644 \
            /mosquitto/config/mosquitto.conf \
            /mosquitto/config/mosquitto.acl
          # SIGHUP reloads the config and the ACL file without dropping the
          # listener, so the service container keeps its published port.
          docker kill -s HUP "$MOSQUITTO_ID"

      - name: Wait for brokers
        run: |
          echo "Waiting for brokers to be ready..."
          sleep 15

          # Test connections to brokers
          for port in 1883 1884 1886 1887 1888; do
            nc -zv localhost $port || echo "Port $port not responding"
          done

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
      - name: Run tests
        if: matrix.python-version != '3.14'
        run: uv run pytest -vv
      - name: Run tests with coverage
        if: matrix.python-version == '3.14'
        run: uv run pytest -vv --cov=src/zmqtt --cov-report=term --cov-report=html
      - name: Store coverage HTML
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-html
          path: htmlcov
          if-no-files-found: error

  tests-macos:
    name: Python ${{ matrix.python-version }} (macOS)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install and start mosquitto
        run: |
          brew install mosquitto
          printf 'listener 1884\nallow_anonymous true\nacl_file %s\n' \
            "$GITHUB_WORKSPACE/docker/mosquitto.acl" > /tmp/mosquitto.conf
          $(brew --prefix)/sbin/mosquitto -c /tmp/mosquitto.conf -d
          sleep 2

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
      - run: uv run pytest -vv --ignore=tests/test_brokers/test_artemis.py --ignore=tests/test_brokers/test_hivemq.py --ignore=tests/test_brokers/test_nanomq.py --ignore=tests/test_brokers/test_emqx.py

  tests-windows:
    name: Python ${{ matrix.python-version }} (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install and start mosquitto
        shell: pwsh
        run: |
          winget install -e --id EclipseFoundation.Mosquitto --accept-source-agreements --accept-package-agreements --silent
          $acl = "$env:GITHUB_WORKSPACE\docker\mosquitto.acl"
          Set-Content -Path "$env:TEMP\mosquitto.conf" -Value "listener 1884`r`nallow_anonymous true`r`nacl_file $acl"
          Start-Process -FilePath "C:\Program Files\mosquitto\mosquitto.exe" -ArgumentList "-c $env:TEMP\mosquitto.conf" -WindowStyle Hidden
          Start-Sleep -Seconds 3

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
      - run: uv run pytest -vv --ignore=tests/test_brokers/test_artemis.py --ignore=tests/test_brokers/test_hivemq.py --ignore=tests/test_brokers/test_nanomq.py --ignore=tests/test_brokers/test_emqx.py

  coverage:
    name: Publish coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [tests, tests-macos, tests-windows]
    permissions:
      actions: read
      statuses: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: latest

      - name: Download coverage HTML
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-html
          path: coverage-html

      - run: uv pip install --system smokeshow
      - run: smokeshow upload coverage-html
        env:
          SMOKESHOW_GITHUB_STATUS_DESCRIPTION: Coverage {coverage-percentage}
          SMOKESHOW_GITHUB_CONTEXT: coverage
          SMOKESHOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: All tests passed
    if: always()
    needs: [tests, tests-macos, tests-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
