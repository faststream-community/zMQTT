name: Package

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

concurrency:
  group: package-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.10"
      - name: Verify lock file
        run: uv lock --check
      - name: Build wheel and source distribution
        run: uv build
      - name: Smoke-test built wheel
        env:
          PACKAGE_VENV: ${{ runner.temp }}/zmqtt-package-venv
        run: |
          uv venv "$PACKAGE_VENV"
          uv pip install --python "$PACKAGE_VENV/bin/python" dist/*.whl
          expected_version=$(uv version --short)
          actual_version=$("$PACKAGE_VENV/bin/python" -c 'from importlib.metadata import version; print(version("zmqtt"))')
          test "$actual_version" = "$expected_version"
