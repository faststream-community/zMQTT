name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release artifacts
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Download immutable release artifacts
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          mkdir dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.whl" \
            --pattern "*.tar.gz" \
            --dir dist

          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      - name: Smoke-test release wheel
        env:
          RELEASE_VENV: ${{ runner.temp }}/zmqtt-publish-venv
        run: |
          uv venv "$RELEASE_VENV"
          uv pip install --python "$RELEASE_VENV/bin/python" dist/*.whl
          expected_version="${RELEASE_TAG#v}"
          expected_version="${expected_version/-alpha./a}"
          installed_version=$("$RELEASE_VENV/bin/python" -c 'from importlib.metadata import version; print(version("zmqtt"))')
          test "$installed_version" = "$expected_version"

      - name: Preserve verified release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: verified-release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/zmqtt
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified immutable artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: verified-release-distributions
          path: dist

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
