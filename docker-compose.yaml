services:
  artemis:
    image: apache/activemq-artemis:latest-alpine
    environment:
      ANONYMOUS_LOGIN: "true"
    ports:
      - "1883:1883"
    security_opt:
      - no-new-privileges:true

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto.acl:/mosquitto/config/mosquitto.acl:ro
    ports:
      - "1884:1883"
    security_opt:
      - no-new-privileges:true

  hivemq:
    image: hivemq/hivemq-ce:latest
    ports:
      - "1886:1883"
    security_opt:
      - no-new-privileges:true

  nanomq:
    image: emqx/nanomq:latest
    ports:
      - "1887:1883"
    security_opt:
      - no-new-privileges:true

  emqx:
    image: emqx/emqx@sha256:0ba29902a8e552f7152754860b4b61b49a7e16fa376035bcf10021e944b2c0a0 # 6.2.2
    ports:
      - 1888:1883
    security_opt:
      - no-new-privileges:true
