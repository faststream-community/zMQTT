services:
  artemis:
    image: apache/activemq-artemis:latest-alpine
    environment:
      ANONYMOUS_LOGIN: "true"
    ports:
      - "1883:1883"
    security_opt:
      - no-new-privileges:true

  mosquitto:
    image: eclipse-mosquitto:2@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797 # 2.1.2-alpine
    command: /bin/sh /mosquitto/config/start-mosquitto-dynsec.sh
    volumes:
      - ./docker/mosquitto-dynsec.conf:/mosquitto/config/mosquitto-dynsec.conf:ro
      - ./docker/start-mosquitto-dynsec.sh:/mosquitto/config/start-mosquitto-dynsec.sh:ro
      - ./docker/dynsec-bootstrap.sh:/mosquitto/config/dynsec-bootstrap.sh:ro
    tmpfs:
      - /mosquitto/data
    ports:
      - "1884:1883"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_ctrl -h 127.0.0.1 -p 1883 -u admin -P admin dynsec getClient zmqtt-mosquitto 2>&1 | grep -q zmqtt-tests",
        ]
      interval: 1s
      timeout: 2s
      retries: 30
    security_opt:
      - no-new-privileges:true

  hivemq:
    image: hivemq/hivemq-ce:latest
    ports:
      - "1886:1883"
    security_opt:
      - no-new-privileges:true

  nanomq:
    image: emqx/nanomq:latest
    ports:
      - "1887:1883"
    security_opt:
      - no-new-privileges:true

  emqx:
    image: emqx/emqx@sha256:0ba29902a8e552f7152754860b4b61b49a7e16fa376035bcf10021e944b2c0a0 # 6.2.2
    environment:
      EMQX_AUTHENTICATION: >-
        [{mechanism = scram, backend = built_in_database, algorithm = sha256,
          iteration_count = 4096, enable = true,
          precondition = "str_eq(listener, 'tcp:scram')"}]
      EMQX_API_KEY__BOOTSTRAP_FILE: /opt/emqx/etc/test-api-keys.txt
      EMQX_LISTENERS__TCP__DEFAULT__ENABLE_AUTHN: "false"
      EMQX_LISTENERS__TCP__SCRAM__ENABLE_AUTHN: "true"
      EMQX_LISTENERS__TCP__SCRAM__BIND: "0.0.0.0:1884"
    volumes:
      - ./docker/emqx-api-keys.txt:/opt/emqx/etc/test-api-keys.txt:ro
    ports:
      - "1888:1883"
      - "1889:1884"
      - "18083:18083"
    security_opt:
      - no-new-privileges:true
