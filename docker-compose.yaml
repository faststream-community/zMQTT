services:
  artemis:
    image: apache/activemq-artemis:latest-alpine@sha256:1bce124d2324faeb1253e2db4bb68d64decf46412ecfd8d9ef46c08b1b4af5b4
    environment:
      ANONYMOUS_LOGIN: "true"
    ports:
      - "1883:1883"
    security_opt:
      - no-new-privileges:true

  mosquitto:
    image: eclipse-mosquitto:2@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797 # 2.1.2-alpine
    command: /bin/sh /mosquitto/config/start-mosquitto-dynsec.sh
    volumes:
      - ./docker/mosquitto-dynsec.conf:/mosquitto/config/mosquitto-dynsec.conf:ro
      - ./docker/start-mosquitto-dynsec.sh:/mosquitto/config/start-mosquitto-dynsec.sh:ro
      - ./docker/dynsec-bootstrap.sh:/mosquitto/config/dynsec-bootstrap.sh:ro
    tmpfs:
      - /mosquitto/data
    ports:
      - "1884:1883"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /mosquitto/data/dynsec-ready && mosquitto_ctrl -h 127.0.0.1 -p 1883 -u admin -P admin dynsec getClient zmqtt-mosquitto 2>&1 | grep -q zmqtt-tests",
        ]
      interval: 1s
      timeout: 2s
      retries: 120
    security_opt:
      - no-new-privileges:true

  hivemq:
    image: hivemq/hivemq-ce@sha256:7ae39e84654a41ced6e946dd84f131d508bc2b862ec96265b7f23d241db214da
    ports:
      - "1886:1883"
    security_opt:
      - no-new-privileges:true

  nanomq:
    image: emqx/nanomq:0.25.5@sha256:a03605fe4061452609e0cd89e4ac0c382dc5bb338319e712bb25b6d21a72ba0a
    ports:
      - "1887:1883"
    security_opt:
      - no-new-privileges:true

  emqx:
    image: emqx/emqx@sha256:0ba29902a8e552f7152754860b4b61b49a7e16fa376035bcf10021e944b2c0a0 # 6.2.2
    ports:
      - 1888:1883
    security_opt:
      - no-new-privileges:true
